[package]
name = "system_core"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"



[dependencies]
pest = "2.7"
pest_derive = "2.7"
cfg-if = "1.0"
rsa = {version = "=0.9.6", default-features = false, features = ["sha2", "pem"]}
rand = "0.8.0"
sha2 = { version = "=0.10.8", default-features = false , features = ["oid"]}
libm = "0.2"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
serde_json = "1.0.149"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
benchmarks = { path = "../../benchmarks" }
dnf_core = { path = "../dnf_core" }
risc0-zkvm = { version = "=3.0.5"}
linfa = "0.8.1"
linfa-trees = "0.8.1"
ndarray = "0.16.1"
risc0-binfmt = "=3.0.5"
methods = { path = "../../methods" }

#serde_json = { version = "1", default-features = false, features = ["alloc"] }
chrono = { version = "0.4.44",  default-features = false, features = ["alloc"]}

