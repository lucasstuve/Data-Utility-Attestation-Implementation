<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1010" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1900" height="1010" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>

  <style>
    .box { fill:#fff; stroke:#111; stroke-width:2.5; }
    .container { fill:none; stroke:#111; stroke-width:2; stroke-dasharray:8 6; }
    .doc { fill:#e3e3e3; stroke:#111; stroke-width:2; }
    .stack { fill:#e3e3e3; stroke:#111; stroke-width:2; }
    .stripe { fill:#cfcfcf; }
    .arrow { stroke:#111; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
    .dash { stroke:#111; stroke-width:1.5; stroke-dasharray:4 4; fill:none; }
    .label { font-size:22px; fill:#111; }
    .italic { font-style:italic; }
    .bold { font-weight:700; }
    .small { font-size:17px; }
    .title { font-size:26px; font-weight:700; fill:#111; }
  </style>

  <!-- ================= LANGUAGE FRONTEND ================= -->
  <text x="360" y="70" class="title">Language Frontend</text>
  <rect x="340" y="90" width="1300" height="430" rx="24" class="container"/>

  <!-- Textual Query -->
  <path d="M80,320 h70 l20,20 v90 h-90 z" class="doc"/>
  <path d="M150,320 v20 h20 z" fill="#bbb" stroke="#111" stroke-width="2"/>
  <text x="115" y="450" text-anchor="middle" class="label italic">Textual</text>
  <text x="115" y="474" text-anchor="middle" class="label italic">Query</text>
  <line x1="170" y1="410" x2="465" y2="410" class="arrow"/>

  <!-- PEG Grammar doc -->
  <path d="M540,100 h70 l20,20 v90 h-90 z" class="doc"/>
  <path d="M610,100 v20 h20 z" fill="#bbb" stroke="#111" stroke-width="2"/>
  <text x="575" y="235" text-anchor="middle" class="label italic">PEG</text>
  <text x="575" y="259" text-anchor="middle" class="label italic">Grammar</text>
  <line x1="575" y1="210" x2="575" y2="295" class="dash" marker-end="url(#arrow)"/>
  <text x="590" y="292" class="small">defines</text>

  <!-- PEG Parser box -->
  <rect x="470" y="300" width="210" height="180" class="box"/>
  <text x="575" y="382" text-anchor="middle" class="label">PEG Parser</text>

  <!-- Parsing arrow -->
  <line x1="680" y1="390" x2="1075" y2="390" class="arrow"/>
  <text x="710" y="378" class="small">Parsing</text>

  <!-- Parse Tree icon -->
  <rect x="860" y="150" width="150" height="130" rx="10" fill="#eee"/>
  <text x="935" y="140" text-anchor="middle" class="label italic">Parse Tree</text>
  <g stroke="#111" stroke-width="2" fill="#fff">
    <rect x="923" y="170" width="16" height="16"/>
    <rect x="893" y="205" width="16" height="16"/>
    <rect x="923" y="205" width="16" height="16"/>
    <rect x="953" y="205" width="16" height="16"/>
    <rect x="893" y="240" width="16" height="16"/>
  </g>
  <g stroke="#111" stroke-width="1.5">
    <line x1="931" y1="186" x2="901" y2="205"/>
    <line x1="931" y1="186" x2="931" y2="205"/>
    <line x1="931" y1="186" x2="961" y2="205"/>
    <line x1="901" y1="221" x2="901" y2="240"/>
  </g>
  <line x1="935" y1="280" x2="935" y2="388" class="dash"/>

  <!-- AST Transformer box -->
  <rect x="1080" y="300" width="210" height="180" class="box"/>
  <text x="1185" y="372" text-anchor="middle" class="label">AST</text>
  <text x="1185" y="398" text-anchor="middle" class="label">Transformer</text>

  <!-- AST construction arrow -->
  <line x1="1290" y1="390" x2="1420" y2="390" class="arrow"/>
  <text x="1305" y="360" class="small">AST</text>
  <text x="1305" y="380" class="small">construction</text>

  <!-- Abstract Syntax Tree icon -->
  <rect x="1430" y="150" width="170" height="150" rx="10" fill="#eee"/>
  <text x="1515" y="140" text-anchor="middle" class="label italic">Abstract Syntax Tree</text>
  <g stroke="#111" stroke-width="2" fill="#fff">
    <rect x="1497" y="175" width="16" height="16"/>
    <rect x="1457" y="215" width="16" height="16"/>
    <rect x="1497" y="215" width="16" height="16"/>
    <rect x="1537" y="215" width="16" height="16"/>
    <rect x="1537" y="255" width="16" height="16"/>
  </g>
  <g stroke="#111" stroke-width="1.5">
    <line x1="1505" y1="191" x2="1465" y2="215"/>
    <line x1="1505" y1="191" x2="1505" y2="215"/>
    <line x1="1505" y1="191" x2="1545" y2="215"/>
    <line x1="1545" y1="231" x2="1545" y2="255"/>
  </g>
  <line x1="1515" y1="390" x2="1515" y2="300" class="dash" opacity="0"/>

  <!-- AST arrow down to backend -->
  <line x1="1185" y1="520" x2="1185" y2="600" class="arrow"/>
  <text x="1200" y="565" class="label bold italic">AST</text>

  <!-- ================= EVALUATION BACKEND ================= -->
  <text x="360" y="605" class="title">Evaluation Backend</text>
  <rect x="340" y="620" width="1300" height="370" rx="24" class="container"/>

  <!-- Interpreter outer box -->
  <rect x="380" y="670" width="1220" height="290" fill="#fff" stroke="#111" stroke-width="3.5"/>
  <text x="990" y="705" text-anchor="middle" class="label" font-size="24">Interpreter</text>

  <!-- E_Batch stack -->
  <g>
    <rect x="90" y="800" width="90" height="70" rx="6" class="stack" transform="translate(16,-16)" opacity="0.6"/>
    <rect x="90" y="800" width="90" height="70" rx="6" class="stack" transform="translate(8,-8)" opacity="0.8"/>
    <rect x="90" y="800" width="90" height="70" rx="6" class="stack"/>
    <text x="135" y="900" text-anchor="middle" class="label italic">E</text>
    <text x="146" y="906" class="small italic">Batch</text>
  </g>
  <line x1="215" y1="835" x2="418" y2="835" class="arrow"/>

  <!-- 4 sub-boxes -->
  <!-- Box 1: Schema Restriction -->
  <rect x="418" y="725" width="270" height="205" class="box" stroke-width="2"/>
  <circle cx="450" cy="758" r="15" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="450" y="764" text-anchor="middle" class="small bold">1</text>
  <text x="480" y="752" class="label italic" font-size="19">Schema Restriction</text>
  <rect x="500" y="800" width="80" height="60" rx="6" class="stack" transform="translate(12,-12)" opacity="0.7"/>
  <rect x="500" y="800" width="80" height="60" rx="6" class="stack" transform="translate(6,-6)" opacity="0.85"/>
  <rect x="500" y="800" width="80" height="60" rx="6" class="stack"/>
  <text x="553" y="908" text-anchor="middle" class="label italic">E</text>
  <text x="562" y="914" class="small italic">Schema</text>

  <!-- Box 2: Assertion-based Selection -->
  <rect x="698" y="725" width="270" height="205" class="box" stroke-width="2"/>
  <circle cx="730" cy="758" r="15" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="730" y="764" text-anchor="middle" class="small bold">2</text>
  <text x="760" y="748" class="label italic" font-size="19">Assertion-based</text>
  <text x="760" y="770" class="label italic" font-size="19">Selection</text>
  <g>
    <rect x="780" y="800" width="80" height="60" rx="6" class="stripe" stroke="#111" stroke-width="2" transform="translate(12,-12)" opacity="0.7"/>
    <rect x="780" y="800" width="80" height="60" rx="6" class="stripe" stroke="#111" stroke-width="2" transform="translate(6,-6)" opacity="0.85"/>
    <rect x="780" y="800" width="80" height="60" rx="6" class="stripe" stroke="#111" stroke-width="2"/>
    <g stroke="#999" stroke-width="1.5" clip-path="inset(0)">
      <line x1="790" y1="800" x2="790" y2="860"/>
      <line x1="805" y1="800" x2="805" y2="860"/>
      <line x1="820" y1="800" x2="820" y2="860"/>
      <line x1="835" y1="800" x2="835" y2="860"/>
      <line x1="850" y1="800" x2="850" y2="860"/>
    </g>
  </g>
  <text x="833" y="908" text-anchor="middle" class="label italic">E</text>
  <text x="842" y="914" class="small italic">Selected</text>

  <!-- Box 3: Construct Evaluation -->
  <rect x="978" y="725" width="270" height="205" class="box" stroke-width="2"/>
  <circle cx="1010" cy="758" r="15" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="1010" y="764" text-anchor="middle" class="small bold">3</text>
  <text x="1040" y="752" class="label italic" font-size="19">Construct Evaluation</text>
  <rect x="998" y="785" width="230" height="34" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="1113" y="808" text-anchor="middle" class="small">Window contexts</text>
  <rect x="998" y="819" width="230" height="34" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="1113" y="842" text-anchor="middle" class="small">Sequence matching</text>
  <rect x="998" y="853" width="230" height="34" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="1113" y="876" text-anchor="middle" class="small">Aggregate checks</text>

  <!-- Box 4: Result Composition -->
  <rect x="1258" y="725" width="270" height="205" class="box" stroke-width="2"/>
  <circle cx="1290" cy="758" r="15" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="1290" y="764" text-anchor="middle" class="small bold">4</text>
  <text x="1320" y="752" class="label italic" font-size="19">Result Composition</text>
  <rect x="1278" y="800" width="230" height="70" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="1393" y="825" text-anchor="middle" class="small">Assertion result &#8743;</text>
  <text x="1393" y="850" text-anchor="middle" class="small">Construct result(s)</text>

  <!-- Interpreter output arrow to Boolean result -->
  <line x1="1600" y1="815" x2="1710" y2="815" class="arrow"/>
  <circle cx="1800" cy="815" r="95" fill="#eee" stroke="#111" stroke-width="2.5"/>
  <text x="1800" y="805" text-anchor="middle" class="label bold">Boolean</text>
  <text x="1800" y="830" text-anchor="middle" class="label bold">Utility Result</text>
</svg>
