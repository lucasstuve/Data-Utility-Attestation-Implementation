[package]
name = "dnf_core"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"


[dependencies]
serde = { version = "1", default-features = false, features = [
    "derive",
    "alloc",
] }
libm = "0.2"

serde_json = { version = "1", default-features = false, features = ["alloc"] }

[[bin]]
name = "input_extractor"
path = "src/bin/input_extractor.rs"
