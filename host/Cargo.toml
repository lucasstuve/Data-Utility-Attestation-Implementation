[package]
name = "host"
version = "0.1.0"
edition = "2021"

[dependencies]
risc0-zkvm = { version = "=3.0.5"}
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = "1.0"
pest = "2.7"
pest_derive = "2.7"
rustyline = "12.0"
cfg-if = "1.0"
dnf_core = { path = "../crates/dnf_core" }
system_core = { path = "../crates/system_core" }
benchmarks = {path = "../benchmarks"}
methods = { path = "../methods" }
rsa = {version = "=0.9.6", default-features = false, features = ["sha2", "pem"]}
rand = "0.8.0"
sha2 = { version = "=0.10.8", default-features = false , features = ["oid"]}
colored = "3"
serde_json ="1.0.150"


[features]
cuda = ["risc0-zkvm/cuda"]
