[workspace]
resolver = "2"
members = ["host", "methods", "crates/dnf_core", "methods/guest", "benchmarks"]

[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
rsa = { git = "https://github.com/risc0/RustCrypto-RSA", tag = "v0.9.6-risczero.0" }

[profile.dev]
opt-level = 3

[profile.release]
debug = 1
lto = true
